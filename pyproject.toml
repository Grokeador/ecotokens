[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecotokens"
version = "0.1.0"
description = "Gateway locale OpenAI-compatibile per Claude, con economia di token"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EcoTokens contributors" }]
keywords = ["llm", "claude", "anthropic", "gateway", "proxy", "prompt-caching"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "openai>=1.40"]

[project.scripts]
ecotokens = "ecotokens.cli:main"

[project.urls]
Homepage = "https://github.com/your-user/ecotokens"

[tool.hatch.build.targets.wheel]
packages = ["ecotokens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
