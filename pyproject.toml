[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecotokens"
# Minore, non patch: la sezione di questa versione nel CHANGELOG ha delle
# **Rotture** - il profilo predefinito passa da `aggressivo` a `prudente`, e
# chi non ha un file di configurazione vedra' un comportamento diverso. Finche'
# la maggiore e' 0 una minore puo' contenerle, ed e' scritto in cima al
# CHANGELOG; pubblicarle sotto una patch non lo sarebbe.
version = "0.3.0"
# Non "gateway OpenAI-compatibile": parla **solo** con Anthropic, e accetta il
# dialetto OpenAI in ingresso perche' cosi' le applicazioni esistenti non si
# riscrivono. Dirlo al contrario e' il malinteso che il progetto si e' imposto
# di non propagare, e su PyPI questa riga e' la prima che si legge.
description = "Gateway locale che riduce la spesa in token verso l'API Anthropic (Claude)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EcoTokens contributors" }]
keywords = ["llm", "claude", "anthropic", "gateway", "proxy", "prompt-caching"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: Proxy Servers",
  "Typing :: Typed",
]
dependencies = [
  # 1.x, non 0.x: l'SDK 1.0 gira su httpx2 e ha una superficie diversa.
  # Un pin permissivo lascerebbe installare una 0.x su cui questo codice non
  # funziona, e l'errore arriverebbe solo alla prima richiesta.
  "anthropic>=1.0,<2",
  # Usato direttamente da bench.py per il trasporto ASGI verso il simulatore.
  # Arriva anche come dipendenza dell'SDK, ma qui lo importiamo noi: dichiararlo
  # e' l'unico modo perche' resti garantito.
  "httpx2>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3", "numpy>=1.26"]
# numpy sta qui e non solo in [semantic]: senza, i test della cache semantica
# verrebbero saltati in CI, ed e' lo stadio che piu' di ogni altro ha bisogno
# di essere provato - e' l'unico che possa restituire una risposta sbagliata.
# `fastembed` invece resta fuori: scarica un modello dalla rete, e i test non
# devono toccare la rete. Lo sostituisce un embedder finto.
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "openai>=1.40",
  "numpy>=1.26",
  "coverage>=7.4",
  # Serve a **controllare** il pacchetto prima di pubblicarlo, non solo a
  # caricarlo: `twine check` rifiuta un README che PyPI non saprebbe rendere,
  # ed e' l'unico modo di scoprirlo prima invece che dopo - una versione
  # pubblicata non si sostituisce, si abbandona.
  "twine>=5.0",
  "build>=1.2",
]

[project.scripts]
ecotokens = "ecotokens.cli:main"

[project.urls]
# Senza questi, la scheda su PyPI non ha nessun collegamento e chi la trova non
# puo' arrivare al codice - il che, per un pacchetto MIT, e' una contraddizione.
#
# **Il repository e' ancora privato**: finche' lo resta, questi indirizzi
# rispondono 404 a chiunque non sia il proprietario. Vanno resi pubblici il
# repository e il pacchetto insieme, o prima il repository - mai il contrario.
Homepage = "https://github.com/Grokeador/ecotokens"
Repository = "https://github.com/Grokeador/ecotokens"
Issues = "https://github.com/Grokeador/ecotokens/issues"
Changelog = "https://github.com/Grokeador/ecotokens/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["ecotokens"]

[tool.hatch.build.targets.sdist]
# Nell'archivio dei sorgenti entrano anche i test e la configurazione di
# esempio: chi lo scarica deve poter verificare da se' che i numeri del README
# siano veri, che e' l'unica cosa che distingue questo progetto dagli altri.
include = ["ecotokens", "tests", "README.md", "README.en.md", "LICENSE", "ecotokens.example.toml", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  # I comandi di misura girano un carico simulato intero: da 9 a 63 secondi
  # l'uno. Restano nella corsa predefinita - un comando che nessun test esegue
  # e' un comando che puo' essere rotto senza che nessuno lo sappia - ma si
  # possono togliere dal ciclo veloce con `-m "not lento"`.
  "lento: esegue un comando di misura per intero (decine di secondi)",
]
