# Configurazione di EcoTokens.
# Copiare in `ecotokens.toml` e modificare. Ogni valore ha un default sensato:
# quello che non serve si puo' cancellare.
#
# Ogni campo si puo' anche sovrascrivere da ambiente, con la forma
# ECOTOKENS_<SEZIONE>__<CAMPO>, per esempio ECOTOKENS_SERVER__PORT=9000

[server]
host = "127.0.0.1"
port = 8000
# Chiave richiesta ai client in Authorization: Bearer.
# Non e' la chiave Anthropic: e' la chiave del gateway. Lasciarla vuota va
# bene finche' il gateway ascolta solo su localhost.
# api_key = "una-chiave-a-piacere"
log_level = "info"

[upstream]
# Non serve indicare la chiave Anthropic qui: l'SDK legge da solo
# ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN o un profilo creato con
# `ant auth login`. Metterla in un file di configurazione e' il modo piu'
# facile per pubblicarla per sbaglio su GitHub.
# api_key = "sk-ant-..."
default_model = "claude-opus-5"
default_effort = "high"
default_max_tokens = 16000
default_max_tokens_stream = 64000
adaptive_thinking = true
# "summarized" per far arrivare al client anche il ragionamento sintetizzato.
thinking_display = "omitted"

[storage]
path = "ecotokens.db"
# Mettere a false per non conservare a disco il testo delle conversazioni.
# Le statistiche e il riconoscimento di sessione continuano a funzionare.
store_message_content = true

[session]
enabled = true
ttl_hours = 72

[cache_planner]
# La leva di risparmio principale: fino al 90% sui token di prefisso riletti.
enabled = true
max_breakpoints = 4
intermediate_every_blocks = 15
# Il primo turno scrive in cache. Sembra sprecato e invece no: prompt di sistema
# e definizioni dei tool sono condivisi anche fra conversazioni diverse, quindi
# quella scrittura viene riletta dalla richiesta successiva. Attivarlo conviene
# solo se ogni richiesta ha un prefisso unico.
skip_first_turn = false
long_ttl_min_turns = 3
long_ttl_min_gap_seconds = 300

[context]
enabled = true
# Elimina i vecchi risultati dei tool dalla richiesta: in un ciclo agentico
# sono quasi sempre la voce di spesa piu' grossa.
clear_tool_uses = true
clear_thinking = false
# Risultati recenti che restano sempre interi.
prune_keep_tool_uses = 3
# Ogni quanti TURNI il confine di potatura puo' avanzare. Lasciando `keep` al
# valore predefinito del server il confine scorre a ogni turno e l'insieme dei
# blocchi svuotati cambia sempre: prefisso nuovo a ogni richiesta, cache mai
# riletta. Misurato: da -36,2% a +7,8% sul carico di costruzione.
# L'unita' e' il turno e non il risultato perche' sei chiamate per turno
# consumano uno scatto sei volte piu' in fretta di una.
prune_step_turns = 4
# Materiale potabile oltre il quale si pota anche senza pressione sulla
# finestra. Misurato: 20.000 e' il minimo, e a 50.000 potare costa PIU' del non
# potare (comincia troppo tardi e sposta il prefisso quando la cache valeva di
# piu'). Attenzione: sotto questa soglia si scambiano soldi misurati contro
# fedelta' che il banco non misura. Alzarlo molto disattiva la potatura.
prune_min_prunable_tokens = 20000
# Guadagno minimo perche' il server tocchi il contesto. 0 = nessuna soglia.
prune_clear_at_least_tokens = 0
# Tool i cui risultati non vanno mai svuotati.
prune_exclude_tools = []
trigger_ratio = 0.6
hard_ratio = 0.85
local_compaction = true
summary_model = "claude-haiku-4-5"
keep_recent_messages = 8
# Ogni quanti messaggi il punto di taglio puo' avanzare. E' il parametro che
# rende la compattazione compatibile con il prompt caching: un taglio che
# insegue la coda della conversazione produce un riassunto nuovo a ogni turno,
# quindi un prefisso nuovo a ogni turno, quindi cache mai riletta. Misurato con
# `ecotokens compaction`: a inseguimento si spende il 40% PIU' che non
# comprimere affatto; a scatti si risparmia il 10%. Curva a U, minimo fra 8 e 16.
recompute_every_messages = 12
# Il riassunto nuovo riparte da quello vecchio e legge solo i messaggi aggiunti.
incremental_summary = true
# Tetto sul riassunto: non e' un risparmio misurato (sui carichi di prova non
# morde mai), e' un paracadute contro il riassunto che parte per la tangente.
summary_max_tokens = 600
# Troncatura dei blocchi passati al riassuntore: per registrare che un file e'
# stato letto non serve rispedire il file.
transcript_block_chars = 400
# Sotto questo guadagno lordo non si comprime: il riassunto costa una chiamata.
min_gain_tokens = 2000

[prompt]
# Riscrittura del prompt in ingresso. I campi sono in ordine di rischio: il
# primo non cambia una parola, l'ultimo le cambia tutte.
enabled = true
# Senza perdita: spazi ripetuti, righe vuote in eccesso, caratteri invisibili
# da copia e incolla, virgolette tipografiche. I blocchi di codice recintati
# restano intatti, perche' li' l'indentazione e' significato.
normalize = true
# Toglie le perifrasi che introducono un'istruzione senza aggiungerle nulla
# ("e' importante notare che", "please note that"). Non e' senza perdita, ma
# non cambia cosa viene chiesto.
strip_filler = false
# Sinonimi piu' corti. Spenta di default per un motivo di metodo: piu' corto in
# caratteri non vuol dire piu' corto in token, e l'unica autorita' sui token e'
# messages.count_tokens. Vedi only_verified.
substitute = false
# Applica solo le sostituzioni che il conteggio vero ha confermato. Si popola
# con `ecotokens substitutions --live`. Spegnerlo significa fidarsi di
# un'intuizione sul tokenizer.
only_verified = true
# Mai i messaggi assistant (parole che il modello ha detto davvero) ne' i tool
# result (dati esterni: riscriverli e' falsificare un'osservazione).
targets = ["system", "user"]
min_chars = 200

[exact_cache]
enabled = true
ttl_seconds = 86400
# La chiave si calcola sul testo normalizzato: due richieste che differiscono
# per uno spazio doppio o una virgoletta tipografica sono la stessa domanda.
# Misurato con `ecotokens cachekey`: -56% su un carico con spaziatura variabile,
# nessuna differenza quando le domande erano gia' identiche.
normalize_key = true
# Le richieste con tool non vengono servite da cache: il risultato dipende da
# uno stato esterno che la cache non conosce.
skip_when_tools = true
max_entries = 5000

[semantic_cache]
# Disattivata di default. Servire una risposta "abbastanza simile" puo'
# restituire una risposta sbagliata: "quanto fa 2+2" e "quanto fa 2+3" sono
# vicinissime nello spazio degli embedding.
# Richiede: pip install ecotokens[semantic]
enabled = false
model_name = "BAAI/bge-small-en-v1.5"
similarity_threshold = 0.97
ttl_seconds = 3600

[router]
enabled = true
# Livello sicuro: abbassa l'effort sulle richieste semplici senza cambiare
# modello, quindi senza invalidare la cache.
effort_downshift = true
simple_effort = "low"
# Cosa fare quando la domanda e' semplice ma il modello potrebbe dover scegliere
# un tool. Misurato: togliere del tutto il veto varrebbe l'11,4% del costo, ma
# il banco misura la lunghezza della risposta, non la sua qualita' - un effort
# basso su un turno agentico puo' produrre la chiamata sbagliata, e un tentativo
# in piu' costa piu' di quanto l'effort abbia risparmiato.
# "medium" prende la parte sicura (2,6%), "low" prende tutto e scommette,
# "off" ripristina il rifiuto in blocco.
effort_with_tools = "medium"
# Si misura la lunghezza della domanda, non del prompt intero.
simple_max_question_tokens = 120
# Livello rischioso: le cache sono legate al modello, quindi cambiarlo a meta'
# conversazione azzera il prompt caching. Da attivare solo con cognizione.
model_downgrade = false
model_locked_per_session = true
downgrade_target = "claude-haiku-4-5"

[budget]
enabled = false
daily_usd = 5.0
monthly_usd = 100.0
# Preventivo esatto con count_tokens prima di inviare: una chiamata in piu'
# (non fatturata) in cambio della certezza di non sforare.
precount = false
