name: CI

# Su ogni push, di qualunque ramo. La prima stesura filtrava su `main`, che in
# questo repository non esiste - il ramo principale si chiama `master` - quindi
# la CI non e' rotta: non si e' mai accesa. Un filtro per ramo su un progetto
# dove il lavoro vive sui rami di feature avrebbe comunque lasciato scoperta la
# parte che conta, cioe' i giorni in cui il codice cambia.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Non fermarsi al primo fallimento: sapere che una versione passa e
      # un'altra no vale piu' che sapere che qualcosa e' fallito.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Esegui i test
        # I test non devono toccare la rete: qui non ce n'e' quasi, e un test
        # che ci provasse fallirebbe in modo confuso invece che esplicito.
        run: pytest -q
